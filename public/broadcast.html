<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FRNN Broadcast</title>
  <link rel="stylesheet" href="/broadcast.css">
</head>
<body>
  <main class="broadcast-shell">
    <header class="channel-header">
      <div class="kicker">FRNN // GLOBAL BROADCAST</div>
      <div id="programState" class="status-badge connecting">CONNECTING</div>
    </header>

    <section id="programStage" class="program-stage" aria-live="polite" aria-busy="true">
      <div class="standby-card">
        <strong>ACQUIRING PROGRAM SIGNAL</strong>
        <span>The receiver is waiting for the authoritative channel state.</span>
      </div>
    </section>

    <section class="program-details" aria-label="Broadcast clock">
      <div class="now-block">
        <div class="label">NOW</div>
        <h1 id="programTitle">WAITING FOR SIGNAL</h1>
        <div id="programMeta" class="meta">NO PROGRAM STATE RECEIVED</div>
      </div>

      <div class="clock-grid">
        <div class="clock-cell">
          <span class="label">ELAPSED</span>
          <strong id="elapsedTime">--:--</strong>
        </div>
        <div class="clock-cell">
          <span class="label">REMAINING</span>
          <strong id="remainingTime">--:--</strong>
        </div>
        <div class="clock-cell">
          <span class="label">NEXT</span>
          <strong id="nextProgram">--</strong>
        </div>
      </div>
    </section>

    <footer class="receiver-status">
      <span id="connectionState" role="status">CONNECTING TO MASTER CLOCK</span>
      <span id="playbackState" role="status">PLAYBACK STANDBY</span>
      <span id="serverTime">SERVER TIME --</span>
    </footer>
  </main>

  <script>
  (() => {
    'use strict';

    const API_URL = '/api/broadcast';
    const POLL_INTERVAL_MS = 5000;
    const MIN_POLL_DELAY_MS = 250;
    const BOUNDARY_GRACE_MS = 100;
    const CLOCK_TICK_MS = 250;

    const byId = id => document.getElementById(id);
    const stage = byId('programStage');
    const state = {
      snapshot: null,
      snapshotKey: '',
      anchorElapsedMs: 0,
      anchorPerformanceMs: 0,
      pollTimer: null,
      inFlight: null,
      boundaryRequestedKey: ''
    };

    function finiteNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function normalizeSnapshot(value) {
      if (!value || (value.status !== 'on_air' && value.status !== 'off_air')) {
        throw new Error('INVALID_BROADCAST_STATE');
      }
      if (Number.isNaN(Date.parse(value.server_time))) throw new Error('INVALID_SERVER_TIME');
      if (value.status === 'off_air') return { ...value, status: 'off_air' };

      const duration = finiteNumber(value.program_duration);
      const elapsed = finiteNumber(value.elapsed);
      const remaining = finiteNumber(value.remaining);
      const program = value.current_program;
      if (!program || value.current_program_id == null || !value.current_program_started_at ||
          Number.isNaN(Date.parse(value.current_program_started_at)) || duration == null || duration <= 0 ||
          elapsed == null || elapsed < 0 || remaining == null || remaining < 0) {
        throw new Error('INVALID_ON_AIR_STATE');
      }
      return {
        ...value,
        program_duration: duration,
        elapsed,
        remaining,
        current_program: { ...program }
      };
    }

    function formatDuration(milliseconds) {
      if (!Number.isFinite(milliseconds)) return '--:--';
      const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function setConnection(message, kind = '') {
      const element = byId('connectionState');
      element.textContent = message;
      element.className = kind;
    }

    function setPlayback(message, kind = '') {
      const element = byId('playbackState');
      element.textContent = message;
      element.className = kind;
    }

    function clearStage() {
      stage.replaceChildren();
      stage.className = 'program-stage';
    }

    function standbyCard(title, detail) {
      clearStage();
      const card = document.createElement('div');
      card.className = 'standby-card';
      const heading = document.createElement('strong');
      heading.textContent = title;
      const copy = document.createElement('span');
      copy.textContent = detail;
      card.append(heading, copy);
      stage.appendChild(card);
    }

    function estimatedElapsed() {
      if (!state.snapshot || state.snapshot.status !== 'on_air') return null;
      const advanced = Math.max(0, performance.now() - state.anchorPerformanceMs);
      return Math.min(state.snapshot.program_duration, state.anchorElapsedMs + advanced);
    }

    function reportPlaybackError(message) {
      setPlayback(`PLAYBACK DEGRADED // ${message}`, 'error');
    }

    function seekVideo(video) {
      const elapsed = estimatedElapsed();
      if (elapsed == null || !Number.isFinite(video.duration) || video.duration <= 0) return;
      const targetSeconds = Math.min(elapsed / 1000, Math.max(0, video.duration - 0.05));
      if (Math.abs((video.currentTime || 0) - targetSeconds) > 1.5) {
        try { video.currentTime = targetSeconds; } catch { reportPlaybackError('SEEK UNAVAILABLE'); }
      }
    }

    function renderTestCard(program) {
      const card = document.createElement('div');
      card.className = 'test-card';
      const marker = document.createElement('span');
      marker.textContent = `PROGRAM ${program.queue_position ?? '--'}`;
      const title = document.createElement('strong');
      title.textContent = program.title || `PROGRAM ${program.id}`;
      const identifier = document.createElement('span');
      identifier.textContent = `SIGNAL ${program.id}`;
      card.append(marker, title, identifier);
      stage.appendChild(card);
      setPlayback('TEST CARD // CLOCK PROOF', 'ok');
    }

    function renderImage(program) {
      if (!program.media_ref) {
        standbyCard('IMAGE NOT ASSIGNED', 'The master clock remains active.');
        reportPlaybackError('MEDIA REFERENCE MISSING');
        return;
      }
      stage.classList.add('media-stage');
      const image = document.createElement('img');
      image.src = program.media_ref;
      image.alt = program.title || 'Current broadcast program';
      image.addEventListener('load', () => setPlayback('IMAGE ONLINE', 'ok'), { once: true });
      image.addEventListener('error', () => reportPlaybackError('IMAGE UNAVAILABLE'), { once: true });
      stage.appendChild(image);
      setPlayback('IMAGE LOADING');
    }

    function renderVideo(program) {
      if (!program.media_ref) {
        standbyCard('VIDEO NOT ASSIGNED', 'The master clock remains active.');
        reportPlaybackError('MEDIA REFERENCE MISSING');
        return;
      }
      stage.classList.add('media-stage');
      const video = document.createElement('video');
      video.src = program.media_ref;
      video.muted = true;
      video.autoplay = true;
      video.playsInline = true;
      video.preload = 'metadata';
      video.addEventListener('loadedmetadata', () => {
        seekVideo(video);
        const attempt = video.play();
        if (attempt && typeof attempt.catch === 'function') {
          attempt.then(() => setPlayback('VIDEO ONLINE', 'ok')).catch(() => reportPlaybackError('AUTOPLAY BLOCKED'));
        }
      });
      video.addEventListener('error', () => reportPlaybackError('VIDEO UNAVAILABLE'));
      stage.appendChild(video);
      setPlayback('VIDEO LOADING');
    }

    function renderProgram(snapshot) {
      const program = snapshot.current_program;
      clearStage();
      if (program.program_type === 'image') renderImage(program);
      else if (program.program_type === 'video') renderVideo(program);
      else renderTestCard(program);
    }

    function renderOffAir(snapshot) {
      state.snapshotKey = 'off_air';
      byId('programState').textContent = 'OFF AIR';
      byId('programState').className = 'status-badge off-air';
      byId('programTitle').textContent = 'CHANNEL STANDBY';
      byId('programMeta').textContent = 'NO PROGRAM IS CURRENTLY TRANSMITTING';
      byId('elapsedTime').textContent = '--:--';
      byId('remainingTime').textContent = '--:--';
      byId('nextProgram').textContent = '--';
      byId('serverTime').textContent = `SERVER TIME ${snapshot.server_time}`;
      standbyCard('FRNN // OFF AIR', 'This receiver will reconnect automatically when the channel starts.');
      setPlayback('PLAYBACK STANDBY');
      stage.setAttribute('aria-busy', 'false');
    }

    function renderClock() {
      const snapshot = state.snapshot;
      if (!snapshot || snapshot.status !== 'on_air') return;
      const elapsed = estimatedElapsed();
      const remaining = Math.max(0, snapshot.program_duration - elapsed);
      byId('elapsedTime').textContent = formatDuration(elapsed);
      byId('remainingTime').textContent = formatDuration(remaining);

      if (remaining <= 0) {
        byId('programState').textContent = 'LIVE // AWAITING SERVER CONFIRMATION';
        if (state.boundaryRequestedKey !== state.snapshotKey) {
          state.boundaryRequestedKey = state.snapshotKey;
          void refresh('boundary');
        }
      }
    }

    function renderOnAir(snapshot, requestRoundTripMs) {
      const nextKey = `${snapshot.current_program_id}:${snapshot.current_program_started_at}`;
      state.anchorElapsedMs = Math.min(
        snapshot.program_duration,
        snapshot.elapsed + Math.max(0, requestRoundTripMs / 2)
      );
      state.anchorPerformanceMs = performance.now();
      state.snapshotKey = nextKey;
      state.boundaryRequestedKey = '';

      byId('programState').textContent = 'LIVE';
      byId('programState').className = 'status-badge live';
      byId('programTitle').textContent = snapshot.current_program.title || `PROGRAM ${snapshot.current_program_id}`;
      byId('programMeta').textContent = `PROGRAM ${snapshot.current_program.queue_position ?? '--'} // ${String(snapshot.current_program.program_type || 'test_card').toUpperCase()}`;
      byId('nextProgram').textContent = snapshot.next_program_id == null ? '--' : String(snapshot.next_program_id);
      byId('serverTime').textContent = `SERVER TIME ${snapshot.server_time}`;
      renderProgram(snapshot);
      renderClock();
      stage.setAttribute('aria-busy', 'false');
    }

    function applySnapshot(rawSnapshot, requestRoundTripMs = 0) {
      const snapshot = normalizeSnapshot(rawSnapshot);
      const priorKey = state.snapshotKey;
      const incomingKey = snapshot.status === 'on_air'
        ? `${snapshot.current_program_id}:${snapshot.current_program_started_at}`
        : 'off_air';
      state.snapshot = snapshot;
      if (snapshot.status === 'off_air') {
        if (priorKey !== incomingKey) renderOffAir(snapshot);
        else byId('serverTime').textContent = `SERVER TIME ${snapshot.server_time}`;
        return;
      }

      if (priorKey !== incomingKey) renderOnAir(snapshot, requestRoundTripMs);
      else {
        state.anchorElapsedMs = Math.min(snapshot.program_duration, snapshot.elapsed + Math.max(0, requestRoundTripMs / 2));
        state.anchorPerformanceMs = performance.now();
        state.boundaryRequestedKey = '';
        byId('serverTime').textContent = `SERVER TIME ${snapshot.server_time}`;
        renderClock();
        const video = stage.querySelector('video');
        if (video) seekVideo(video);
      }
    }

    function nextPollDelay() {
      const snapshot = state.snapshot;
      if (!snapshot || snapshot.status !== 'on_air') return POLL_INTERVAL_MS;
      const remaining = Math.max(0, snapshot.program_duration - estimatedElapsed());
      return Math.min(POLL_INTERVAL_MS, Math.max(MIN_POLL_DELAY_MS, remaining + BOUNDARY_GRACE_MS));
    }

    function schedulePoll(delay = nextPollDelay()) {
      if (state.pollTimer != null) clearTimeout(state.pollTimer);
      const boundedDelay = Math.min(POLL_INTERVAL_MS, Math.max(MIN_POLL_DELAY_MS, delay));
      state.pollTimer = setTimeout(() => {
        state.pollTimer = null;
        void refresh('poll');
      }, boundedDelay);
    }

    async function refresh(reason = 'manual') {
      if (state.inFlight) return state.inFlight;
      const startedAt = performance.now();
      setConnection(reason === 'bootstrap' ? 'CONNECTING TO MASTER CLOCK' : 'SYNCING MASTER CLOCK');
      state.inFlight = (async () => {
        try {
          const response = await fetch(API_URL, {
            method: 'GET',
            cache: 'no-store',
            headers: { Accept: 'application/json' }
          });
          if (!response.ok) throw new Error(`BROADCAST_HTTP_${response.status}`);
          const payload = await response.json();
          const roundTripMs = Math.max(0, performance.now() - startedAt);
          applySnapshot(payload, roundTripMs);
          setConnection('MASTER CLOCK SYNCED', 'ok');
        } catch {
          setConnection('CONNECTION DEGRADED // RETRYING', 'error');
          if (!state.snapshot) {
            byId('programState').textContent = 'CONNECTION ERROR';
            byId('programState').className = 'status-badge error';
            byId('programTitle').textContent = 'SIGNAL TEMPORARILY UNAVAILABLE';
            byId('programMeta').textContent = 'NO AUTHORITATIVE PROGRAM STATE RECEIVED';
            standbyCard('RECEIVER OFFLINE', 'The receiver will retry without changing the channel.');
            setPlayback('PLAYBACK UNAVAILABLE', 'error');
            stage.setAttribute('aria-busy', 'false');
          }
        } finally {
          state.inFlight = null;
          schedulePoll();
        }
      })();
      return state.inFlight;
    }

    setInterval(renderClock, CLOCK_TICK_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') void refresh('visible');
    });
    window.addEventListener('online', () => void refresh('online'));
    window.addEventListener('pageshow', event => {
      if (event.persisted) void refresh('restore');
    });
    void refresh('bootstrap');
  })();
  </script>
</body>
</html>
